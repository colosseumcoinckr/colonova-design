# ColoNova Design 배포 검증 — main 푸시·PR 에서 "릴리스가 막히는 것"과
# "규칙이 깨지는 것"을 먼저 본다.
#
# 무엇을 돌리는가:
# - 배포 검증(빌드): 릴리스 워크플로우(desktop-release.yml)가 태그에서 돌리는
#   것과 같은 `pnpm -r build`(위상 정렬 — protocol → daemon·web → desktop).
#   빌드가 깨지면 에셋이 못 나오므로 태그를 밀기 전에 이 문에서 잡는다.
#   각 패키지의 build 는 tsc 컴파일 그 자체라 타입 오류도 같은 문에서 걸린다.
# - 정적 검사(biome): 전수. pre-commit 은 스테이징 파일만 보므로, 쌓이는
#   포맷·import 오류를 막는 문은 여기뿐이다.
# - 순수 시험: 프로세스를 띄우지 않는 시험만 돌린다. 선별기(`scripts/pure-tests.mjs`)가
#   로컬 `pnpm test` 와 같은 glob 전수에서 머리에 `CI-순수-제외` 표식이 든 파일만 뺀다.
#   라벨 · 어휘 · 공통 규칙 · 턴 통계 · 로그 정화 같은 규칙의 회귀가 로컬 없이도 지켜진다.
#
# 2026-09-21: 테스트 레인(L1·L2·L3·L5, 정적 검사)은 운영 판단으로
# 걷어냈다 — 러너(Linux)와 실제 배포 플랫폼(mac·Windows) 환경이 어긋나
# 제품이 아니라 러너를 탓하는 빨간 신호가 5일(릴리스 2건) 지속됐다.
# 2026-10-02: 그 결정을 좁혀 되살린다. 플랫폼을 전혀 만지지 않는 순수 시험과
# biome 은 러너와 무관하므로 그 빨간불의 이유가 닿지 않는다. 프로세스를
# 띄우는 시험은 여전히 로컬 `pnpm test` 에만 둔다. 출처: 2026-10-02 프로젝트 개선 분석 8번.
# 2026-10-24: 수동 목록을 선별기로 바꾼다 — 목록이 실제 파일과 어긋나 유령 7개로 깨지던
# 문과, 목록에 못 들어온 순수 시험이 저절로 생기던 구멍을 같이 닫는다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    name: 배포 검증 (빌드)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 루트 package.json 의 packageManager 필드가 결정한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 설치
        run: pnpm install --frozen-lockfile

      - name: 빌드 (릴리스와 같은 경로)
        run: pnpm -r build

  lint:
    name: 정적 검사 (biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 설치
        run: pnpm install --frozen-lockfile

      # 경고는 통과다 — 오류(포맷 · import · 린트)만 이 문이 막는다.
      - name: biome 전수 검사
        run: pnpm exec biome check packages scripts

  pure-tests:
    name: 순수 시험 (프로세스 없음)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 설치
        run: pnpm install --frozen-lockfile

      # 데몬 시험은 dist 를 읽는다 — 빌드가 시험의 재료다.
      - name: 빌드
        run: pnpm -r build

      # 프로세스를 띄우는 시험은 여기에 두지 않는다 — 그 시험의 머리에
      # `CI-순수-제외` 표식이 있고 선별기가 뺀다. 새 순수 시험은 표식이
      # 없으면 저절로 이 문에 들어온다(로컬 `pnpm test` 는 전수).
      - name: 순수 시험
        run: node --test $(node scripts/pure-tests.mjs)

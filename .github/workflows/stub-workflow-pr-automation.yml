# PR 자동화 5종(Draft 전환 · type 라벨 · size 라벨 · 작성자 assignee · Slack 리뷰 스레드 오픈)을
# **한 잡**의 reusable 로 호출하는 stub. 구 `stub-workflow-pr-auto-draft-and-pr-notify.yml` 과
# `stub-workflow-pr-labels-and-review-assign.yml`(잡 5개)을 대체한다 — Actions 는 잡마다 분 단위로
# 올림 청구하므로 잡 수가 곧 비용이다. 근거와 대가는 docs/adr/0007-pr-automation-single-job.md.
#
# 판정(어느 이벤트에 어느 그룹이 도는가)은 전부 reusable 의 잡 `if` 에 있다 — 스텁에는 `if` 를
# 두지 않는다. 조건이 바뀌어도 태그 이동만으로 전 spoke 에 닿게 하기 위함이다
# (docs/org-workflow-architecture.md §3.8 이 봇 액터 가드를 스텁에 두지 않는 것과 같은 이유).
name: "[ORG] PR Automation"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, review_request_removed]

# caller(stub)의 권한이 호출하는 reusable workflow 의 GITHUB_TOKEN 상한(ceiling)이 된다.
#   - contents: read        → checkout (size 라벨 · Slack 알림의 준비 스텝)
#   - pull-requests: write  → 라벨 · assignee · PR 본문에 Slack 스레드 링크/마커 주입
# Draft 전환은 App 토큰(contents: write)으로 하므로 여기에는 없다.
permissions:
  contents: read
  pull-requests: write

jobs:
  pr-automation:
    uses: colosseumcoinckr/.github/.github/workflows/org-workflow-pr-automation.yml@v2
    secrets: inherit
packages:
  - 'packages/*'

# Vite depends on esbuild, whose install script fetches the platform binary.
allowBuilds:
  electron: true
  electron-builder: true
  electron-winstaller: true
  esbuild: true
  # lefthook 은 설치 스크립트가 git 훅 러너 바이너리를 링크한다.
  lefthook: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.299'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.299'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.299'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.299'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.299'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.299'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.299'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.299'
  - '@anthropic-ai/claude-agent-sdk@0.3.299'

overrides:
  brace-expansion@^1.0.0: ^1.1.21
  brace-expansion@^2.0.0: ^2.1.7
  brace-expansion@^5.0.0: ^5.0.12
  lodash-es: ^4.18.1
  dompurify: ^3.4.16
  fast-uri: ^3.1.8
  ip-address: ^10.7.1

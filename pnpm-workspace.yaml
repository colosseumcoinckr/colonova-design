packages:
  - 'packages/*'

# Vite depends on esbuild, whose install script fetches the platform binary.
allowBuilds:
  electron: true
  electron-builder: true
  electron-winstaller: true
  esbuild: true
  # lefthook 은 설치 스크립트가 git 훅 러너 바이너리를 링크한다.
  lefthook: true

# Dependabot 경보 치료 (2026-10-02) — 전이 의존성이라 소비자 범위로 갈라
# 각 메이저 라인의 패치판으로 올린다. brace-expansion v4 소비자는 없다.
overrides:
  brace-expansion@^1.0.0: ^1.1.21
  brace-expansion@^2.0.0: ^2.1.7
  brace-expansion@^5.0.0: ^5.0.12
  lodash-es: ^4.18.1
  dompurify: ^3.4.16
  fast-uri: ^3.1.8
  ip-address: ^10.7.1
